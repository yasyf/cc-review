name: Release

# cc-review ships a Homebrew cask plus bare per-arch binaries
# (cc-review_<os>_<arch>) that the plugin's install-binary.sh downloads
# directly — both come out of the in-repo .goreleaser.yaml. A goreleaser
# before-hook builds the go:embed web SPA first, so the shared workflow
# installs bun.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    uses: yasyf/homebrew-tap/.github/workflows/release-go.yml@a0015cd88d2e6bef1a5c475a4e2cad5d875c7f47
    secrets: inherit
    with:
      setup-bun: true

  # Refresh the committed binrun descriptor (plugin/bin/cc-review.binrun) to pin
  # the just-released version, and move the plugin manifest to the same version
  # in the same commit. It gates on `release` (rather than a `release: published`
  # trigger) because a release goreleaser creates with the default GITHUB_TOKEN
  # does not fire `release` events for other workflows. Both files are committed
  # back to main because the plugin marketplace serves main HEAD, and the
  # descriptor is re-uploaded to the release for parity. Bumping plugin.json here
  # (not in a separate hand commit) keeps it in lockstep with the descriptor, so
  # the CI agreement gate stays green after every release.
  descriptor:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir dist --pattern '*.tar.gz' --pattern 'checksums.txt'
      - name: Render descriptor and sync manifest version
        run: |
          version="${GITHUB_REF_NAME#v}"
          plugin/scripts/render-descriptor.sh dist "$version" > plugin/bin/cc-review.binrun
          chmod +x plugin/bin/cc-review.binrun
          jq --arg v "$version" '.version = $v' plugin/.claude-plugin/plugin.json > plugin/.claude-plugin/plugin.json.tmp
          mv plugin/.claude-plugin/plugin.json.tmp plugin/.claude-plugin/plugin.json
      - name: Validate descriptor
        run: go run github.com/yasyf/binrun/cmd/binrun@v0.1.1 -- parse plugin/bin/cc-review.binrun
      - name: Commit refreshed descriptor and manifest to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- plugin/bin/cc-review.binrun plugin/.claude-plugin/plugin.json; then
            echo "descriptor and manifest already current for ${GITHUB_REF_NAME}"
          else
            git add plugin/bin/cc-review.binrun plugin/.claude-plugin/plugin.json
            git commit -m "chore: sync cc-review.binrun + manifest to ${GITHUB_REF_NAME}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload descriptor to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" plugin/bin/cc-review.binrun --repo "${GITHUB_REPOSITORY}" --clobber
