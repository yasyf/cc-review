name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Web build first: //go:embed all:internal/web/dist reads at compile time,
      # so the embed dir must be fresh before the Go build/test/vet run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build web SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx vite build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...
