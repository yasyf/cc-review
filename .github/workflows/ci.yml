name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string

# PRs only: cancel-in-progress on main leaves pushed commits with no CI verdict
# when a later push kills a slow macOS run mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # macOS: daemonkit v0.21 is structurally macOS-only — the sysctl, csops, and
  # LOCAL_PEERCRED seams have no non-darwin stubs, so the module does not build
  # on linux.
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # The plugin manifest and the binrun descriptor must pin the same version
      # (the marketplace serves plugin.json; hooks resolve bin/cc-review.binrun).
      - name: Assert plugin manifest and descriptor agree on version
        run: |
          manifest="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          descriptor="$(tail -n +2 plugin/bin/cc-review.binrun | jq -r .version.static)"
          test "$manifest" = "$descriptor" \
            || { echo "version drift: plugin.json=$manifest descriptor=$descriptor" >&2; exit 1; }

      # Web build first: //go:embed all:internal/web/dist reads at compile time,
      # so the embed dir must be fresh before the Go build/test/vet run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build web SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx vite build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      # The internal/vcs jj backend tests run against a real jj binary and
      # t.Skip without one — install it so they can't silently skip.
      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.42.0/jj-v0.42.0-aarch64-apple-darwin.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...

  # Static analysis type-checks the tree, so it runs for darwin. GOOS/GOARCH keep
  # it on a cheap linux runner instead of billing macOS minutes 10x.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          GOOS= GOARCH= go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
