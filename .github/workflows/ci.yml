name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact commit to validate
        required: true
        type: string

# PRs only: cancel-in-progress on main leaves pushed commits with no CI verdict
# when a later push kills a slow macOS run mid-flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            jj: aarch64-apple-darwin
          - os: ubuntu-latest
            jj: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}

      # The plugin manifest and the binrun descriptor must pin the same version
      # (the marketplace serves plugin.json; hooks resolve bin/cc-review.binrun).
      - name: Assert plugin manifest and descriptor agree on version
        run: |
          manifest="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          descriptor="$(tail -n +2 plugin/bin/cc-review.binrun | jq -r .version.static)"
          test "$manifest" = "$descriptor" \
            || { echo "version drift: plugin.json=$manifest descriptor=$descriptor" >&2; exit 1; }

      # Web build first: //go:embed all:internal/web/dist reads at compile time,
      # so the embed dir must be fresh before the Go build/test/vet run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build web SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx vite build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      # The internal/vcs jj backend tests run against a real jj binary and
      # t.Skip without one — install it so they can't silently skip.
      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.42.0/jj-v0.42.0-${{ matrix.jj }}.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go build
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Supervised review smoke
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: '0'
          CC_REVIEW_HTTP_PORT: '7392'
          CC_REVIEW_URL: http://127.0.0.1:17392
        run: |
          go build -o "$RUNNER_TEMP/cc-review" ./cmd/cc-review
          ccr="$RUNNER_TEMP/cc-review"
          "$ccr" supervise &
          supervisor=$!
          repo="$RUNNER_TEMP/repo"
          git init -q "$repo"
          git -C "$repo" -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m init
          echo change > "$repo/file.txt"
          for _ in $(seq 20); do
            out="$("$ccr" start --session smoke --cwd "$repo")" && break
            sleep 0.5
          done
          url="${out%%$'\n'*}"
          echo "$url"
          case "$url" in http://127.0.0.1:17392/s/*) ;; *) echo "unexpected review URL: $url" >&2; exit 1 ;; esac
          curl -fsS -o /dev/null "http://127.0.0.1:7392${url#http://127.0.0.1:17392}"
          "$ccr" stop
          kill -TERM "$supervisor"
          wait "$supervisor"

  # Static analysis type-checks the tree once per shipped OS. GOOS/GOARCH keep
  # the darwin leg on a cheap linux runner instead of billing macOS minutes 10x.
  lint:
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goos == 'darwin' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goos == 'darwin' && 'arm64' || 'amd64' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          GOOS= GOARCH= go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
