name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Web build first: //go:embed all:internal/web/dist reads at compile time,
      # so the embed dir must be fresh before the Go build/test/vet run.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Build web SPA
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bunx vite build

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
      # The internal/vcs jj backend tests run against a real jj binary and
      # t.Skip without one — install it so they can't silently skip.
      - name: Install jj
        run: |
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.42.0/jj-v0.42.0-x86_64-unknown-linux-musl.tar.gz \
            | sudo tar -xz -C /usr/local/bin ./jj
          jj --version
      - name: go vet
        run: go vet ./...
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: go build
        run: go build ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
