version: '3'

# The web build MUST run before the Go build: //go:embed all:internal/web/dist
# reads at compile time, so a stale or empty dist gets baked into the binary
# otherwise. `build` enforces that order.

vars:
  VERSION: '{{.VERSION | default "dev"}}'
  LDFLAGS: -X github.com/yasyf/cc-review/internal/version.Version={{.VERSION}}

tasks:
  default:
    desc: Build the web SPA, then the binary
    deps: [build]

  build-web:
    desc: Install web deps and build the SPA into internal/web/dist
    dir: web
    cmds:
      - bun install
      - bunx vite build

  build-go:
    desc: Build the cc-review binary (embeds whatever is in internal/web/dist)
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o plugin/bin/cc-review ./cmd/cc-review

  build:
    desc: Build the SPA then the binary (order is load-bearing for go:embed)
    cmds:
      - task: build-web
      - task: build-go

  dev:
    desc: Run the daemon (fixed dev port) and the Vite dev server together
    deps:
      - task: dev-daemon
      - task: dev-web

  dev-daemon:
    desc: Run the daemon in the foreground on the fixed dev port
    cmds:
      - go run ./cmd/cc-review daemon --dev

  dev-web:
    desc: Run the Vite dev server (proxies /api and /events to the dev daemon)
    dir: web
    cmds:
      - bun run dev

  test:
    desc: Run the Go test suite with the race detector
    cmds:
      - go test -race -count=1 ./...

  vet:
    desc: Vet the Go module
    cmds:
      - go vet ./...

  typecheck-web:
    desc: Type-check the web SPA
    dir: web
    cmds:
      - bun run typecheck

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf plugin/bin/cc-review internal/web/dist/assets
